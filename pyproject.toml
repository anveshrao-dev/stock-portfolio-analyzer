[project]
name = "stock-portfolio-analyzer"
version = "0.1.0"
description = "A local application for consolidating and analyzing stock portfolios."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "streamlit>=1.65.0",
    "yfinance>=1.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
